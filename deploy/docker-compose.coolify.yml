# ============================================================================
# Docker Compose for Coolify — MinecraftServerTool
# ============================================================================
# Paste this file into Coolify (New Resource → Docker Compose → Empty) or point
# a Coolify resource at it. It pulls the images published by the GitHub Release
# workflow; nothing is built on the Coolify host. See deploy/COOLIFY.md.
#
# Differences from the root docker-compose.yml, on purpose:
#   - no `build:` sections, no `container_name` (Coolify rewrites it to
#     <service>-<uuid>; the app locates siblings by compose labels instead),
#   - the web UI is NOT published on a host port: Coolify's proxy routes the
#     domain you assign to the mc-tool service → container port 8000,
#   - Infrared config lives in its own named volume (short syntax) instead of
#     a `subpath` mount of mc-data, which Coolify does not reliably rewrite,
#   - the in-app nginx/certbot HTTPS feature is disabled (EXTERNAL_HTTPS_PROXY)
#     because ports 80/443 belong to Coolify's proxy.
#
# Environment variables you set in Coolify (Configuration → Environment Variables):
#   MC_DOMAIN   (required)  base domain; servers get <name>.mc.<MC_DOMAIN>
#   VERSION     (optional)  release tag without the "v", default "latest"
#   SERVICE_PASSWORD_POSTGRES is generated by Coolify automatically.
#
# Host requirements:
#   - TCP 25565 open in the firewall (Minecraft traffic bypasses the HTTP proxy)
#   - DNS: *.mc.<MC_DOMAIN> → this host; the panel domain → this host
#   - Docker socket access: mc-tool spawns one container per Minecraft server.
# ============================================================================

services:
  mc-tool:
    image: ghcr.io/dajda2371/minecraftservertool:${VERSION:-latest}
    expose:
      - "8000"
    environment:
      # Coolify generates the panel domain for this service and routes it to :8000.
      # You can override it under the service's Domains settings.
      SERVICE_FQDN_MC_TOOL_8000:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: mcserver
      POSTGRES_USER: mcserver
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      # Image for every spawned Minecraft server container (pulled from GHCR).
      SERVER_BASE_IMAGE: ghcr.io/dajda2371/mc-server-base:${VERSION:-latest}
      # Auto-generated server hostnames: <name>.mc.<MC_DOMAIN>
      MC_DOMAIN: ${MC_DOMAIN:?}
      MC_DOCKER_NETWORK: mc-net
      # TLS is terminated by Coolify's proxy; disable the in-app nginx/certbot flow.
      EXTERNAL_HTTPS_PROXY: "true"
      # Trust X-Forwarded-* headers from the proxy (uvicorn reads this natively).
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      # Docker socket — allows mc-tool to create/control sibling containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistent app data (worlds, build caches, exports)
      - mc-data:/app/data
      # Infrared config, shared with the infrared service
      - mc-infrared-config:/app/data/infrared
    networks:
      - mc-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mcserver
      POSTGRES_USER: mcserver
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - mc-postgres-data:/var/lib/postgresql/data
    networks:
      - mc-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcserver -d mcserver"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  infrared:
    image: haveachin/infrared:latest
    ports:
      # The ONLY published port: Minecraft clients connect here (TCP, not HTTP,
      # so it is intentionally not routed through Coolify's proxy).
      - "25565:25565"
    volumes:
      - mc-infrared-config:/etc/infrared
    networks:
      - mc-net
    depends_on:
      - mc-tool
    restart: unless-stopped

volumes:
  mc-data:
  mc-postgres-data:
  mc-infrared-config:

networks:
  # Fixed name: spawned Minecraft containers join this network so Infrared can
  # reach them by container name. Coolify additionally attaches every service
  # to its own per-resource network; both coexist.
  mc-net:
    name: mc-net
    driver: bridge
